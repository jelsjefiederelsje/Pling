<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Pling — Familie Point App</title>
<meta name="theme-color" content="#7C4DFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pling">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23F7F4FF'/%3E%3Cellipse cx='50' cy='58' rx='34' ry='32' fill='%23FFB6D9' stroke='%232B2320' stroke-width='3'/%3E%3Ccircle cx='40' cy='54' r='4' fill='%232B2320'/%3E%3Ccircle cx='60' cy='54' r='4' fill='%232B2320'/%3E%3Cellipse cx='34' cy='64' rx='6' ry='3.5' fill='%23FF9EB8' opacity='0.6'/%3E%3Cellipse cx='66' cy='64' rx='6' ry='3.5' fill='%23FF9EB8' opacity='0.6'/%3E%3Cpath d='M44 63 q6 6 12 0' fill='none' stroke='%232B2320' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23F7F4FF'/%3E%3Cellipse cx='50' cy='58' rx='34' ry='32' fill='%23FFB6D9' stroke='%232B2320' stroke-width='3'/%3E%3Ccircle cx='40' cy='54' r='4' fill='%232B2320'/%3E%3Ccircle cx='60' cy='54' r='4' fill='%232B2320'/%3E%3Cpath d='M44 63 q6 6 12 0' fill='none' stroke='%232B2320' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#7C4DFF; --purple-dark:#5E35D6; --ink:#241948;
    --muted:#6b5f8a; --muted2:#8a7fb0; --muted3:#a79bd1;
    --bg:#F7F4FF; --card:#FFFFFF; --line:#e7e1fb;
    --green-bg:#EAFBC7; --green-tx:#4C7A00; --lime:#B4FF3C;
    --coral-bg:#FFF0EA; --coral-tx:#C7451B; --coral:#FF6B4A; --cream:#FFF3D6; --wood:#FFE9B8; --wood-tx:#8B5A2B;
    --poppins:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --body:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#E7E0F7;font-family:var(--body);color:var(--ink);display:flex;justify-content:center;align-items:center;overflow:hidden}
  @keyframes confettiPop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.3);opacity:0}}
  @keyframes pointFloat{to{transform:translateY(-40px);opacity:0}}
  @keyframes bouncePill{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
  @keyframes toastPop{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  @keyframes sparkleTwinkle{0%,100%{opacity:.1;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
  @keyframes popIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

  /* Phone frame (desktop) → fills screen on mobile */
  .frame{position:relative;width:412px;max-width:100vw;height:min(892px,100vh);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
         border-radius:34px;box-shadow:0 24px 60px rgba(80,50,160,.35);border:1px solid rgba(255,255,255,.6)}
  @media(max-width:460px){ body{background:var(--bg)} .frame{height:100dvh;max-width:100vw;border-radius:0;box-shadow:none;border:none} }

  .screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
  .screen.active{display:flex;animation:popIn .22s ease}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* Decorative banners */
  .stripe{height:14px;background:repeating-linear-gradient(90deg,var(--purple) 0 17px,var(--lime) 17px 34px)}
  .stripe.shop{background:repeating-linear-gradient(90deg,var(--coral) 0 17px,var(--cream) 17px 34px)}
  .scallops{display:flex;height:13px;overflow:hidden}
  .scallops i{flex:1;border-radius:0 0 50% 50%}

  /* Header */
  .head{padding:14px 16px 12px;display:flex;align-items:center;gap:12px}
  .avatar-btn{width:52px;height:52px;flex-shrink:0;border:none;background:none;padding:0;cursor:pointer}
  .whoami{flex:1;min-width:0}
  .whoami .nm{font-family:var(--poppins);font-weight:600;font-size:16px;line-height:1.1}
  .whoami .ag{font-size:12px;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--green-bg);padding:7px 13px;border-radius:100px}
  .pill .n{font-family:var(--poppins);font-weight:700;font-size:15px;color:var(--green-tx)}
  .lock{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}

  .today{padding:0 18px;font-size:13px;color:var(--muted);margin:2px 0 10px}

  /* Section card */
  .sec{margin:0 14px 14px;background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(124,77,255,.07);overflow:hidden}
  .sec-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer}
  .sec-h h3{font-family:var(--poppins);font-weight:600;font-size:15px;margin:0}
  .sec-h .cv{color:var(--muted3);font-size:13px}

  /* Task row */
  .task{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid #F3EFFB;cursor:pointer;transition:opacity .25s}
  .task .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .task .tx{flex:1;min-width:0}
  .task .tt{font-weight:600;font-size:14.5px}
  .task .fr{font-size:11.5px;color:var(--muted2)}
  .task .pts{font-family:var(--poppins);font-weight:700;font-size:13px;color:var(--green-tx);background:var(--green-bg);padding:3px 9px;border-radius:100px;flex-shrink:0}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:.2s}
  .task.done{opacity:.5}
  .task.done .check{background:var(--purple);border-color:var(--purple)}

  /* Shop */
  .catbar{margin:4px 14px 0;background:var(--wood);color:var(--wood-tx);font-family:var(--poppins);font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:12px}
  .reward{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:0 14px;border-bottom:1px solid #F3EFFB}
  .reward .ic{width:42px;height:42px;border-radius:12px;background:#FFF6E4;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .reward .tt{flex:1;font-weight:600;font-size:14.5px}
  .cost{font-family:var(--poppins);font-weight:700;font-size:13px;color:var(--coral-tx);background:var(--coral-bg);padding:4px 10px;border-radius:100px}
  .buy{border:none;background:var(--purple);color:#fff;font-family:var(--poppins);font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:100px;cursor:pointer;margin-left:8px}

  /* Bottom nav */
  .nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--muted3);font-family:var(--poppins);font-weight:600;font-size:11px}
  .nav button .i{font-size:20px}
  .nav button.on{color:var(--purple)}

  /* Welcome */
  .welcome{align-items:center;justify-content:center;text-align:center;padding:40px 30px;gap:14px}
  .welcome h1{font-family:var(--poppins);font-weight:700;font-size:30px;margin:6px 0 0}
  .wtag{display:inline-block;background:#EEE9FB;color:var(--muted2);font-family:var(--poppins);font-weight:600;font-size:10.5px;padding:3px 10px;border-radius:100px;letter-spacing:.4px;text-transform:uppercase}
  .welcome p{font-size:14.5px;color:var(--muted);line-height:1.5;max-width:30ch;margin:4px 0 0}
  .cta{background:var(--purple);color:#fff;border:none;border-radius:100px;padding:14px 34px;font-family:var(--poppins);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(124,77,255,.35);margin-top:8px}
  .link{background:none;border:none;color:var(--muted3);font-size:12.5px;cursor:pointer;margin-top:2px}
  .link b{color:var(--purple)}

  /* Overlays */
  .toast{position:absolute;left:50%;bottom:78px;transform:translateX(-50%);background:#241948;color:#fff;padding:10px 18px;border-radius:100px;font-size:13px;font-weight:600;z-index:60;animation:toastPop .25s ease;pointer-events:none;white-space:nowrap;box-shadow:0 8px 22px rgba(0,0,0,.25)}
  .float{position:absolute;font-family:var(--poppins);font-weight:700;color:var(--green-tx);font-size:16px;z-index:60;animation:pointFloat .9s ease forwards;pointer-events:none}
  .confetti{position:absolute;width:9px;height:9px;z-index:55;animation:confettiPop .8s ease-out forwards;pointer-events:none}

  .stagebadge{position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:40;background:rgba(36,25,72,.72);color:#fff;font-family:var(--poppins);font-weight:600;font-size:10px;padding:4px 10px;border-radius:100px;letter-spacing:.3px}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="stagebadge">FASE 0 · SKELET</div>

  <!-- WELCOME -->
  <div class="screen welcome active" data-screen="welcome" id="s-welcome">
    <div id="welcomeAvatar" style="width:96px;height:96px"></div>
    <span class="wtag">Arbejdstitel</span>
    <h1 id="appName">Pling</h1>
    <p>Løs opgaver, saml point, og forkæl din avatar i butikken. Klar til at komme i gang?</p>
    <button class="cta" onclick="go('home')">Kom i gang</button>
    <button class="link" onclick="toast('Parring kommer i Fase 4 🔑')">Er du et barn? <b>Indtast din kode</b></button>
  </div>

  <!-- HOME / OPGAVER -->
  <div class="screen" data-screen="home" id="s-home">
    <div class="stripe"></div>
    <div class="scallops" id="homeScallops"></div>
    <div class="scroll">
      <div class="head">
        <button class="avatar-btn" id="homeAvatar" onclick="cycleAvatar()" title="Tryk for at skifte look"></button>
        <div class="whoami"><div class="nm">Emma</div><div class="ag">8 år</div></div>
        <div class="pill" id="pill"><span>🪙</span><span class="n" id="pts">0</span></div>
        <div class="lock" onclick="toast('Skift profil kommer i Fase 4 🔒')">🔒</div>
      </div>
      <div class="today" id="today"></div>
      <div class="sec">
        <div class="sec-h" onclick="toggleTasks()"><h3>Opgaver</h3><span class="cv" id="tasksCv">▾</span></div>
        <div id="taskList"></div>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--muted3);padding:2px 0 16px">Tryk på en opgave for at løse den ✨ (demo)</div>
    </div>
    <div class="nav" id="nav"></div>
  </div>

  <!-- SHOP / BUTIK -->
  <div class="screen" data-screen="shop" id="s-shop" style="background:#FFF8EA">
    <div class="stripe shop"></div>
    <div class="scallops" id="shopScallops"></div>
    <div class="scroll">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px">
        <div style="font-family:var(--poppins);font-weight:700;font-size:19px">🍋 Butikken</div>
        <div class="pill"><span>🪙</span><span class="n" id="pts2">0</span></div>
      </div>
      <div class="catbar">🎉 Oplevelser</div>
      <div id="shopExp"></div>
      <div class="catbar" style="margin-top:12px">⭐ Privilegier</div>
      <div id="shopPriv"></div>
      <div style="text-align:center;font-size:11px;color:var(--muted3);padding:12px 0 16px">Rigtig indløsning kommer i Fase 1 🍋</div>
    </div>
    <div class="nav" id="nav2"></div>
  </div>
</div>

<script>
/* ---------- Dumpling-avatar (portet fra designets spec) ---------- */
function shade(hex,pct){
  const h=hex.replace('#',''); const num=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  let r=(num>>16)+Math.round(255*pct), g=((num>>8)&0xFF)+Math.round(255*pct), b=(num&0xFF)+Math.round(255*pct);
  r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}
const PATTERNS={
  tiger:'repeating-linear-gradient(48deg,#F4A93B 0px,#F4A93B 9px,#2B2320 9px,#2B2320 13px)',
  zebra:'repeating-linear-gradient(48deg,#FFFFFF 0px,#FFFFFF 9px,#2B2320 9px,#2B2320 13px)',
  elephant:'linear-gradient(155deg,#C7C7CE 0%,#AFAFB8 55%,#97979F 100%)',
  panda:'radial-gradient(circle at 22% 18%,#2B2320 13%,transparent 14%),radial-gradient(circle at 78% 18%,#2B2320 13%,transparent 14%),#FFFFFF'
};
const GOLD='linear-gradient(120deg,#B8860B 0%,#FFD700 35%,#FFF8D0 50%,#FFD700 65%,#B8860B 100%)';
const SPARKS=[{l:'16%',t:'30%'},{l:'70%',t:'20%'},{l:'44%',t:'50%'},{l:'76%',t:'64%'},{l:'26%',t:'68%'}];
const isPat=v=>!!PATTERNS[v]||v==='golden';
function avatarHTML(o){
  o=o||{}; const size=o.size||96, bc=o.bodyColor||'#FFB6D9', hat=o.hat||'', pants=o.pants||'';
  const pat=isPat(bc), gold=bc==='golden';
  const bg=gold?GOLD:(pat?PATTERNS[bc]:`linear-gradient(155deg,${shade(bc,.14)} 0%,${bc} 55%,${shade(bc,-.05)} 100%)`);
  const legBg=pants==='golden'?GOLD:pants;
  const ow=Math.max(1.5,Math.round(size*.025)), oc='#2B2320';
  let inner='';
  inner+=`<div style="position:absolute;top:44%;left:30%;width:9%;height:9%;border-radius:50%;background:${oc}"></div>`;
  inner+=`<div style="position:absolute;top:44%;right:30%;width:9%;height:9%;border-radius:50%;background:${oc}"></div>`;
  inner+=`<div style="position:absolute;top:57%;left:14%;width:15%;height:9%;border-radius:50%;background:#FF9EB8;opacity:.55"></div>`;
  inner+=`<div style="position:absolute;top:57%;right:14%;width:15%;height:9%;border-radius:50%;background:#FF9EB8;opacity:.55"></div>`;
  inner+=`<div style="position:absolute;top:56%;left:50%;transform:translateX(-50%);width:13%;height:7%;border-bottom:${Math.max(1.5,Math.round(size*.02))}px solid ${oc};border-radius:0 0 50% 50%"></div>`;
  if(pants){
    inner+=`<div style="position:absolute;bottom:-4%;left:18%;width:23%;height:15%;border-radius:35% 35% 12px 12px;background:${legBg};border:${ow}px solid ${oc};box-sizing:border-box;z-index:2"></div>`;
    inner+=`<div style="position:absolute;bottom:-4%;right:18%;width:23%;height:15%;border-radius:35% 35% 12px 12px;background:${legBg};border:${ow}px solid ${oc};box-sizing:border-box;z-index:2"></div>`;
  }
  if(gold){ SPARKS.forEach(s=>{const sz=Math.max(3,Math.round(size*.045));
    inner+=`<div style="position:absolute;left:${s.l};top:${s.t};width:${sz}px;height:${sz}px;background:#fff;box-shadow:0 0 ${Math.round(sz*1.6)}px rgba(255,255,255,.95);transform:rotate(45deg);animation:sparkleTwinkle 1.7s ease-in-out infinite"></div>`;}); }
  const body=`<div style="position:absolute;left:8%;right:8%;top:26%;bottom:6%;border-radius:48% 48% 44% 44% / 58% 58% 42% 42%;background:${bg};border:${ow}px solid ${oc};box-sizing:border-box;box-shadow:inset 0 -8px 14px rgba(0,0,0,.07),0 4px 10px rgba(0,0,0,.14);overflow:visible">${inner}</div>`;
  const hatEl=hat?`<div style="position:absolute;top:14%;left:50%;transform:translate(-50%,-60%);font-size:${Math.round(size*.4)}px;line-height:1;z-index:8">${hat}</div>`:'';
  return `<div style="position:relative;width:${size}px;height:${size}px">${body}${hatEl}</div>`;
}

/* ---------- Demo-state (kun i hukommelsen — rigtig data kommer med Firebase) ---------- */
const LOOKS=[
  {bodyColor:'#FFB6D9',hat:''},{bodyColor:'#AEDFF7',hat:'🎀'},{bodyColor:'tiger',hat:''},
  {bodyColor:'zebra',hat:'🧢'},{bodyColor:'panda',hat:''},{bodyColor:'golden',hat:'👑'},{bodyColor:'#B8E8B0',hat:'🐸'}
];
let lookIx=0, points=0, targetStart=120;
const TASKS=[
  {ic:'🛏️',bg:'#EFE9FF',tt:'Red din seng',fr:'Hver dag',pts:5,done:false},
  {ic:'🦷',bg:'#E3FBF6',tt:'Børst tænder',fr:'Hver dag',pts:5,done:false},
  {ic:'🍽️',bg:'#FFEDE3',tt:'Tøm opvaskemaskinen',fr:'Hver dag',pts:10,done:false},
  {ic:'📚',bg:'#FFF6D8',tt:'Læs 15 minutter',fr:'Hver dag',pts:8,done:false}
];
const EXP=[{ic:'🎬',tt:'Biograftur',cost:120},{ic:'🍕',tt:'Vælg aftensmad',cost:60}];
const PRIV=[{ic:'📱',tt:'30 min ekstra skærmtid',cost:40},{ic:'🛌',tt:'Sengetid +30 min',cost:50}];
const DAYS=['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];

function el(id){return document.getElementById(id);}
function drawScallops(id,a,b){el(id).innerHTML=Array.from({length:24},(_,i)=>`<i style="background:${i%2?b:a}"></i>`).join('');}
function renderAvatars(){
  el('welcomeAvatar').innerHTML=avatarHTML({size:96,bodyColor:'#FFB6D9',hat:'🎩'});
  el('homeAvatar').innerHTML=avatarHTML(Object.assign({size:52},LOOKS[lookIx]));
}
function renderTasks(){
  const order=[...TASKS.keys()].sort((a,b)=>(TASKS[a].done?1:0)-(TASKS[b].done?1:0));
  el('taskList').innerHTML=order.map(i=>{const t=TASKS[i];
    return `<div class="task ${t.done?'done':''}" onclick="doTask(${i},event)">
      <div class="ic" style="background:${t.bg}">${t.ic}</div>
      <div class="tx"><div class="tt">${t.tt}</div><div class="fr">${t.fr}</div></div>
      <div class="pts">+${t.pts}</div>
      <div class="check">${t.done?'✓':''}</div>
    </div>`;}).join('');
}
function renderShop(){
  const row=r=>`<div class="reward"><div class="ic">${r.ic}</div><div class="tt">${r.tt}</div><div class="cost">${r.cost} 🪙</div><button class="buy" onclick="toast('Rigtig indløsning kommer i Fase 1 🍋')">Indløs</button></div>`;
  el('shopExp').innerHTML=EXP.map(row).join('');
  el('shopPriv').innerHTML=PRIV.map(row).join('');
}
function setPts(v){points=v; el('pts').textContent=v; el('pts2').textContent=v;}
function countUp(to){
  const from=points, steps=16; let i=0;
  const iv=setInterval(()=>{i++; setPts(Math.round(from+(to-from)*i/steps)); if(i>=steps){clearInterval(iv);setPts(to);}},22);
  const p=el('pill'); p.style.animation='none'; void p.offsetWidth; p.style.animation='bouncePill .4s ease';
}

/* ---------- Interaktioner ---------- */
let tasksOpen=true;
function toggleTasks(){tasksOpen=!tasksOpen; el('taskList').style.display=tasksOpen?'block':'none'; el('tasksCv').textContent=tasksOpen?'▾':'▸';}
function cycleAvatar(){lookIx=(lookIx+1)%LOOKS.length; renderAvatars(); const a=el('homeAvatar'); a.style.animation='none'; void a.offsetWidth; a.style.animation='bouncePill .4s ease'; toast('Ny avatar-komponent ✨');}
function doTask(i,ev){
  const t=TASKS[i]; if(t.done) return; t.done=true;
  setPts(points); countUp(points+t.pts);
  if(ev){pointFloat(ev.clientX,ev.clientY,'+'+t.pts); confettiAt(ev.clientX,ev.clientY);}
  renderTasks();
  if(TASKS.every(x=>x.done)) setTimeout(()=>{countUp(points+15); toast('🌟 Hele dagen klaret! +15 bonus');},650);
}
function go(screen){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.dataset.screen===screen));
  buildNav('nav',screen); buildNav('nav2',screen);
  if(screen==='home' && points===0) setTimeout(()=>countUp(targetStart),260);
}
function buildNav(id,active){
  el(id).innerHTML=`
    <button class="${active==='home'?'on':''}" onclick="go('home')"><span class="i">✅</span>Opgaver</button>
    <button class="${active==='shop'?'on':''}" onclick="go('shop')"><span class="i">🍋</span>Butik</button>`;
}
let toastT;
function toast(msg){let t=document.querySelector('.toast'); if(t)t.remove();
  t=document.createElement('div'); t.className='toast'; t.textContent=msg; el('frame').appendChild(t);
  clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),1900);}
function pointFloat(x,y,txt){const f=el('frame').getBoundingClientRect();
  const d=document.createElement('div'); d.className='float'; d.textContent=txt;
  d.style.left=(x-f.left-8)+'px'; d.style.top=(y-f.top-10)+'px'; el('frame').appendChild(d); setTimeout(()=>d.remove(),950);}
function confettiAt(x,y){const f=el('frame').getBoundingClientRect(); const cols=['#7C4DFF','#B4FF3C','#FF6B4A','#FFB6D9','#AEDFF7','#FFD700'];
  for(let i=0;i<14;i++){const c=document.createElement('div'); c.className='confetti'; c.style.background=cols[i%cols.length];
    c.style.left=(x-f.left)+'px'; c.style.top=(y-f.top)+'px'; c.style.borderRadius=(i%2?'50%':'2px');
    const ang=Math.random()*Math.PI*2, dist=40+Math.random()*70;
    c.style.setProperty('--dx',Math.cos(ang)*dist+'px'); c.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    c.style.setProperty('--rot',(Math.random()*540-270)+'deg'); el('frame').appendChild(c); setTimeout(()=>c.remove(),820);}
}

drawScallops('shopScallops','#FF6B4A','#FFF3D6');
renderAvatars(); renderTasks(); renderShop();
el('today').textContent='I dag er det '+DAYS[new Date().getDay()]+' ☀️';
buildNav('nav','welcome'); buildNav('nav2','welcome');
