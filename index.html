<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Pling — Familie Point App</title>
<meta name="theme-color" content="#7C4DFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pling">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23F7F4FF'/%3E%3Cellipse cx='50' cy='58' rx='34' ry='32' fill='%23FFB6D9' stroke='%232B2320' stroke-width='3'/%3E%3Ccircle cx='40' cy='54' r='4' fill='%232B2320'/%3E%3Ccircle cx='60' cy='54' r='4' fill='%232B2320'/%3E%3Cpath d='M44 63 q6 6 12 0' fill='none' stroke='%232B2320' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23F7F4FF'/%3E%3Cellipse cx='50' cy='58' rx='34' ry='32' fill='%23FFB6D9' stroke='%232B2320' stroke-width='3'/%3E%3Ccircle cx='40' cy='54' r='4' fill='%232B2320'/%3E%3Ccircle cx='60' cy='54' r='4' fill='%232B2320'/%3E%3Cpath d='M44 63 q6 6 12 0' fill='none' stroke='%232B2320' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#7C4DFF; --purple-dark:#5E35D6; --ink:#241948;
    --muted:#6b5f8a; --muted2:#8a7fb0; --muted3:#a79bd1;
    --bg:#F7F4FF; --card:#FFFFFF; --line:#e7e1fb;
    --green-bg:#EAFBC7; --green-tx:#4C7A00; --lime:#B4FF3C;
    --coral-bg:#FFF0EA; --coral-tx:#C7451B; --coral:#FF6B4A; --cream:#FFF3D6; --wood:#FFE9B8; --wood-tx:#8B5A2B;
    --band:18px;
    --poppins:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --body:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:#E7E0F7;font-family:var(--body);color:var(--ink);display:flex;justify-content:center;align-items:center;overflow:hidden}
  @keyframes confettiPop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.3);opacity:0}}
  @keyframes pointFloat{to{transform:translateY(-42px);opacity:0}}
  @keyframes bouncePill{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
  @keyframes toastPop{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
  @keyframes sparkleTwinkle{0%,100%{opacity:.1;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.1) rotate(25deg)}}
  @keyframes popIn{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-8px)}40%,60%{transform:translateX(8px)}}

  .frame{position:relative;width:412px;max-width:100vw;height:min(892px,100vh);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
         border-radius:34px;box-shadow:0 24px 60px rgba(80,50,160,.35);border:1px solid rgba(255,255,255,.6)}
  @media(max-width:460px){ body{background:var(--bg)} .frame{height:100dvh;max-width:100vw;border-radius:0;box-shadow:none;border:none} }
  #app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
  .scr{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

  .stripe{height:14px}
  .scallops{display:flex;height:12px;overflow:hidden}
  .scallops i{flex:0 0 var(--band);width:var(--band);border-radius:0 0 50% 50%}

  .head{padding:14px 16px 12px;display:flex;align-items:center;gap:12px}
  .avatar-btn{width:54px;height:54px;flex-shrink:0;border:none;background:none;padding:0;cursor:pointer;position:relative}
  .avatar-btn .pen{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:10px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .whoami{flex:1;min-width:0}
  .whoami .nm{font-family:var(--poppins);font-weight:600;font-size:16px;line-height:1.1}
  .whoami .ag{font-size:12px;color:var(--muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;background:var(--green-bg);padding:7px 13px;border-radius:100px}
  .pill .n{font-family:var(--poppins);font-weight:700;font-size:15px;color:var(--green-tx)}
  .lock{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;flex-shrink:0}
  .today{padding:0 18px;font-size:13px;color:var(--muted);margin:2px 0 8px}
  .goldbar{margin:0 14px 10px;background:linear-gradient(120deg,#FFF3C4,#FFE07A);border:1px solid #F0CE5A;border-radius:14px;padding:10px 14px;font-size:13.5px;font-weight:600;color:#8a6a00;font-family:var(--poppins)}
  .msgbanner{margin:0 14px 10px;background:#EAF3FF;border:1px solid #cfe2fb;border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-size:13px}
  .msgbanner .x{margin-left:auto;cursor:pointer;color:#9bb3d1;font-size:12px}

  .sec{margin:0 14px 14px;background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(124,77,255,.07);overflow:hidden}
  .sec-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer}
  .sec-h h3{font-family:var(--poppins);font-weight:600;font-size:15px;margin:0}
  .sec-h .cv{color:var(--muted3);font-size:13px}

  .task{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid #F3EFFB;cursor:pointer;transition:opacity .25s}
  .task .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .task .tx{flex:1;min-width:0}
  .task .tt{font-weight:600;font-size:14.5px}
  .task .fr{font-size:11.5px;color:var(--muted2)}
  .task .pts{font-family:var(--poppins);font-weight:700;font-size:13px;color:var(--green-tx);background:var(--green-bg);padding:3px 9px;border-radius:100px;flex-shrink:0}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;transition:.2s}
  .task.done{opacity:.5}
  .task.done .check{background:var(--purple);border-color:var(--purple)}
  .hint{text-align:center;font-size:11px;color:var(--muted3);padding:2px 0 16px}

  .shopwrap{background:#FFF8EA}
  .shophead{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
  .shophead .t{font-family:var(--poppins);font-weight:700;font-size:19px}
  .shophead .r{display:flex;align-items:center;gap:8px}
  .receipt{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid #efe2c4;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer}
  .catbar{margin:8px 14px 0;background:var(--wood);color:var(--wood-tx);font-family:var(--poppins);font-weight:700;font-size:13.5px;padding:9px 14px;border-radius:12px}
  .reward{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 14px;border-bottom:1px solid #F1E7Cf}
  .reward:last-child{border-bottom:none}
  .reward .ic{width:44px;height:44px;border-radius:12px;background:#FFF6E4;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
  .reward .tt{flex:1;font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .reward .tt .sub{font-size:11.5px;color:var(--muted2);font-weight:600}
  .cost{flex:0 0 62px;font-family:var(--poppins);font-weight:700;font-size:12.5px;color:var(--coral-tx);background:var(--coral-bg);padding:5px 0;border-radius:100px;text-align:center}
  .buy{flex:0 0 104px;border:none;background:var(--purple);color:#fff;font-family:var(--poppins);font-weight:600;font-size:12.5px;padding:9px 0;border-radius:100px;cursor:pointer;white-space:nowrap;text-align:center}
  .buy.owned,.buy.today{background:#E8F6D8;color:var(--green-tx)}
  .buy.short{background:#F0ECF7;color:var(--muted2)}

  .nav{display:flex;background:#fff;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
  .nav button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer;color:var(--muted3);font-family:var(--poppins);font-weight:600;font-size:11px}
  .nav button .i{font-size:20px}
  .nav button.on{color:var(--purple)}

  .welcome{align-items:center;justify-content:center;text-align:center;padding:40px 30px;gap:14px}
  .welcome h1{font-family:var(--poppins);font-weight:700;font-size:30px;margin:6px 0 0}
  .wtag{display:inline-block;background:#EEE9FB;color:var(--muted2);font-family:var(--poppins);font-weight:600;font-size:10.5px;padding:3px 10px;border-radius:100px;letter-spacing:.4px;text-transform:uppercase}
  .welcome p{font-size:14.5px;color:var(--muted);line-height:1.5;max-width:30ch;margin:4px 0 0}
  .cta{background:var(--purple);color:#fff;border:none;border-radius:100px;padding:14px 34px;font-family:var(--poppins);font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 8px 20px rgba(124,77,255,.35);margin-top:8px}
  .link{background:none;border:none;color:var(--muted3);font-size:12.5px;cursor:pointer;margin-top:2px}
  .link b{color:var(--purple)}

  .picker{padding:28px 20px 22px;gap:16px;overflow:auto}
  .picker .ttl{text-align:center;font-family:var(--poppins);font-weight:700;font-size:23px}
  .picker .sub{text-align:center;font-size:13px;color:var(--muted);margin-top:4px}
  .pcard{background:#fff;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:13px;box-shadow:0 4px 16px rgba(124,77,255,.12);cursor:pointer;margin-top:12px}
  .pcard .nm{font-family:var(--poppins);font-weight:600;font-size:15.5px}
  .pcard .ag{font-size:12px;color:var(--muted)}
  .addcard{border:1.5px dashed #c9bdf0;background:#fff;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:center;gap:8px;color:var(--purple);font-family:var(--poppins);font-weight:600;font-size:14px;cursor:pointer;margin-top:12px}
  .plabel{margin:22px 0 0;font-size:11px;font-weight:700;color:var(--muted3);text-transform:uppercase;letter-spacing:.5px}
  .prow{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .pmini{flex:1;min-width:120px;background:#fff;border:1.5px dashed #c9bdf0;border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer}
  .pmini .nm{font-family:var(--poppins);font-weight:600;font-size:13.5px}

  .ed-top{display:flex;align-items:center;gap:10px;padding:14px 16px}
  .backbtn{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;flex-shrink:0}
  .ed-title{font-family:var(--poppins);font-weight:600;font-size:16px}
  .ed-preview{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0 4px}
  .nameinput{font-family:var(--poppins);font-weight:600;font-size:17px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;width:70%;color:var(--ink)}
  .grid-h{font-family:var(--poppins);font-weight:600;font-size:13px;color:var(--muted);margin:16px 16px 0;text-transform:uppercase;letter-spacing:.3px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 16px 0}
  .item{position:relative;background:#fff;border:2px solid transparent;border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:0 2px 6px rgba(124,77,255,.06)}
  .item.sel{border-color:var(--purple)}
  .item.locked{opacity:.55}
  .item .lab{font-size:10px;color:var(--muted2);font-weight:600}
  .item .price{font-size:9.5px;color:var(--coral-tx);font-weight:700}
  .item .lk{position:absolute;top:4px;right:5px;font-size:11px}
  .swatch{width:38px;height:38px;border-radius:50%;border:2px solid #2B2320}

  .hrow{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:0 14px;border-bottom:1px solid #F3EFFB}
  .hrow .ic{width:40px;height:40px;border-radius:12px;background:#F3EFFB;display:flex;align-items:center;justify-content:center;font-size:19px}
  .hrow .tt{flex:1;font-weight:600;font-size:14px}
  .hrow .wh{font-size:11.5px;color:var(--muted2)}
  .empty{text-align:center;color:var(--muted2);font-size:13.5px;padding:34px 30px}

  .ptabs{display:flex;gap:8px;padding:4px 14px 10px;overflow-x:auto;border-bottom:1px solid var(--line)}
  .ptab{flex:0 0 auto;border:none;background:#F1ECF9;color:var(--muted);font-family:var(--poppins);font-weight:600;font-size:12px;padding:8px 14px;border-radius:100px;cursor:pointer;white-space:nowrap}
  .ptab.on{background:var(--purple);color:#fff}
  .admwrap{padding:12px 14px}
  .addbtn{width:100%;border:1.5px dashed #c9bdf0;background:#fff;color:var(--purple);font-family:var(--poppins);font-weight:600;font-size:14px;padding:12px;border-radius:14px;cursor:pointer;margin-bottom:10px}
  .adm{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(124,77,255,.06);margin-bottom:10px;overflow:hidden}
  .adm-h{display:flex;align-items:center;gap:10px;padding:12px}
  .adm-ic{width:42px;height:42px;border-radius:12px;background:#F3EFFB;border:none;font-size:20px;cursor:pointer;flex-shrink:0}
  .adm-tt{flex:1;min-width:0;cursor:pointer;font-weight:600;font-size:14.5px}
  .adm-sub{font-size:11.5px;color:var(--muted2);font-weight:400;margin-top:2px}
  .del{border:none;background:none;color:#c9b6d6;font-size:16px;cursor:pointer;flex-shrink:0;padding:6px}
  .adm-body{padding:6px 14px 14px;border-top:1px solid #F3EFFB}
  .fld{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:12px 0 4px}
  .txt{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;font-family:var(--body);color:var(--ink)}
  .stp{display:flex;align-items:center;gap:12px;margin-top:2px}
  .stp button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#F8F5FE;font-size:18px;cursor:pointer;color:var(--purple-dark);flex-shrink:0}
  .stp span{font-family:var(--poppins);font-weight:700;font-size:16px;min-width:36px;text-align:center}
  .numin{width:66px;border:1px solid var(--line);border-radius:10px;padding:7px 0;text-align:center;font-family:var(--poppins);font-weight:700;font-size:16px;color:var(--ink)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .chip2{border:1px solid var(--line);background:#F8F5FE;color:var(--muted);border-radius:100px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--body)}
  .chip2.on{background:var(--purple);color:#fff;border-color:var(--purple)}
  .seg{display:flex;gap:6px;margin-top:2px}
  .seg button{flex:1;border:1px solid var(--line);background:#F8F5FE;color:var(--muted);border-radius:10px;padding:9px 0;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--body)}
  .seg button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
  .agebox{display:flex;gap:16px;margin-top:2px}
  .agebox .col{flex:1}
  .catpick{margin-top:2px}
  .catpick .opt{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;padding:7px 0}
  .catpick .opt .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;flex-shrink:0}
  .catpick .opt.sel .rd{background:var(--purple);border-color:var(--purple)}
  .sw{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
  .sw input{opacity:0;width:0;height:0}
  .sw span{position:absolute;inset:0;background:#d9cff0;border-radius:100px;transition:.2s;cursor:pointer}
  .sw span:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .sw input:checked+span{background:var(--purple)}
  .sw input:checked+span:before{transform:translateX(18px)}
  .ovcard{background:#fff;border-radius:16px;box-shadow:0 2px 8px rgba(124,77,255,.06);padding:14px;margin-bottom:12px}
  .ovhead{display:flex;align-items:center;gap:10px}
  .ovstats{display:flex;gap:10px;margin:10px 0 4px}
  .ovstat{flex:1;background:#F8F5FE;border-radius:12px;padding:9px 6px;text-align:center}
  .ovstat .v{font-family:var(--poppins);font-weight:700;font-size:18px}
  .ovstat .l{font-size:10.5px;color:var(--muted2)}
  .msgrow{display:flex;gap:8px;margin-top:10px}
  .msgrow input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px}
  .msgrow button{border:none;background:var(--purple);color:#fff;border-radius:10px;padding:0 16px;font-weight:600;cursor:pointer;font-family:var(--poppins)}
  .set-h{font-family:var(--poppins);font-weight:700;font-size:14px;margin:14px 14px 0}
  .setrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:0 2px 8px rgba(124,77,255,.06);padding:12px 14px;margin:10px 14px 0}
  .setrow .t{flex:1;font-size:14px;font-weight:600}
  .btn{background:var(--purple);color:#fff;border:none;border-radius:100px;padding:12px 20px;font-family:var(--poppins);font-weight:600;font-size:14px;cursor:pointer}
  .btn.ghost{background:#F1ECF9;color:var(--purple-dark)}

  #overlay{position:absolute;inset:0;z-index:50;display:none}
  #overlay.on{display:block}
  .backdrop{position:absolute;inset:0;background:rgba(30,20,60,.55);animation:fadeIn .2s ease;display:flex;align-items:center;justify-content:center;padding:24px}
  .sheet{background:#fff;border-radius:22px;width:100%;max-width:340px;padding:22px;animation:popIn .2s ease;max-height:82%;overflow:auto}
  .setup{background:linear-gradient(160deg,#2A2150,#1c1638);color:#fff;position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 28px;gap:16px;text-align:center;animation:fadeIn .2s ease}
  .setup h2{font-family:var(--poppins);font-weight:700;font-size:22px;margin:0}
  .setup .desc{font-size:13.5px;color:#c9c1e8;max-width:28ch}
  .setup input{font-family:var(--poppins);font-weight:600;font-size:18px;text-align:center;border:none;border-radius:14px;padding:12px 16px;width:80%;color:var(--ink)}
  .sugg{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  .sugg button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:100px;padding:6px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--body)}
  .dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
  .dots i{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.25)}
  .dots i.f{background:#fff}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:250px}
  .keypad button{background:rgba(255,255,255,.12);border:none;color:#fff;font-family:var(--poppins);font-weight:600;font-size:20px;padding:15px 0;border-radius:16px;cursor:pointer}
  .keypad button.blank{background:none;cursor:default}
  .setup .np{background:var(--purple);border:none;color:#fff;font-family:var(--poppins);font-weight:600;font-size:15px;padding:12px 30px;border-radius:100px;cursor:pointer}
  .setup .cancel{background:none;border:none;color:#b6acdc;font-size:13px;cursor:pointer}

<script>
/* ===== Avatar ===== */
function shade(hex,pct){
  const h=(hex||'#FFB6D9').replace('#',''); const num=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  let r=(num>>16)+Math.round(255*pct), g=((num>>8)&0xFF)+Math.round(255*pct), b=(num&0xFF)+Math.round(255*pct);
  r=Math.min(255,Math.max(0,r)); g=Math.min(255,Math.max(0,g)); b=Math.min(255,Math.max(0,b));
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}
const PATTERNS={
  tiger:'repeating-linear-gradient(48deg,#F4A93B 0px,#F4A93B 9px,#2B2320 9px,#2B2320 13px)',
  zebra:'repeating-linear-gradient(48deg,#FFFFFF 0px,#FFFFFF 9px,#2B2320 9px,#2B2320 13px)',
  elephant:'linear-gradient(155deg,#C7C7CE 0%,#AFAFB8 55%,#97979F 100%)',
  panda:'radial-gradient(circle at 22% 18%,#2B2320 13%,transparent 14%),radial-gradient(circle at 78% 18%,#2B2320 13%,transparent 14%),#FFFFFF'
};
const GOLD='linear-gradient(120deg,#B8860B 0%,#FFD700 35%,#FFF8D0 50%,#FFD700 65%,#B8860B 100%)';
const SPARKS=[{l:'16%',t:'30%'},{l:'70%',t:'20%'},{l:'44%',t:'50%'},{l:'76%',t:'64%'},{l:'26%',t:'68%'}];
const isPat=v=>!!PATTERNS[v]||v==='golden';
function avatarHTML(o){
  o=o||{}; const size=o.size||96, bc=o.bodyColor||'#FFB6D9', hat=o.hat||'', pants=o.pants||'';
  const pat=isPat(bc), gold=bc==='golden';
  const bg=gold?GOLD:(pat?PATTERNS[bc]:`linear-gradient(155deg,${shade(bc,.14)} 0%,${bc} 55%,${shade(bc,-.05)} 100%)`);
  const legBg=pants==='golden'?GOLD:pants; const ow=Math.max(1.5,Math.round(size*.025)), oc='#2B2320';
  let inner='';
  inner+=`<div style="position:absolute;top:44%;left:30%;width:9%;height:9%;border-radius:50%;background:${oc}"></div>`;
  inner+=`<div style="position:absolute;top:44%;right:30%;width:9%;height:9%;border-radius:50%;background:${oc}"></div>`;
  inner+=`<div style="position:absolute;top:57%;left:14%;width:15%;height:9%;border-radius:50%;background:#FF9EB8;opacity:.55"></div>`;
  inner+=`<div style="position:absolute;top:57%;right:14%;width:15%;height:9%;border-radius:50%;background:#FF9EB8;opacity:.55"></div>`;
  inner+=`<div style="position:absolute;top:56%;left:50%;transform:translateX(-50%);width:13%;height:7%;border-bottom:${Math.max(1.5,Math.round(size*.02))}px solid ${oc};border-radius:0 0 50% 50%"></div>`;
  if(pants){
    inner+=`<div style="position:absolute;bottom:-4%;left:18%;width:23%;height:15%;border-radius:35% 35% 12px 12px;background:${legBg};border:${ow}px solid ${oc};box-sizing:border-box;z-index:2"></div>`;
    inner+=`<div style="position:absolute;bottom:-4%;right:18%;width:23%;height:15%;border-radius:35% 35% 12px 12px;background:${legBg};border:${ow}px solid ${oc};box-sizing:border-box;z-index:2"></div>`;
  }
  if(gold){ SPARKS.forEach(s=>{const sz=Math.max(3,Math.round(size*.045));
    inner+=`<div style="position:absolute;left:${s.l};top:${s.t};width:${sz}px;height:${sz}px;background:#fff;box-shadow:0 0 ${Math.round(sz*1.6)}px rgba(255,255,255,.95);transform:rotate(45deg);animation:sparkleTwinkle 1.7s ease-in-out infinite"></div>`;}); }
  const body=`<div style="position:absolute;left:8%;right:8%;top:26%;bottom:6%;border-radius:48% 48% 44% 44% / 58% 58% 42% 42%;background:${bg};border:${ow}px solid ${oc};box-sizing:border-box;box-shadow:inset 0 -8px 14px rgba(0,0,0,.07),0 4px 10px rgba(0,0,0,.14)">${inner}</div>`;
  const hatEl=hat?`<div style="position:absolute;top:14%;left:50%;transform:translate(-50%,-60%);font-size:${Math.round(size*.4)}px;line-height:1;z-index:8">${hat}</div>`:'';
  return `<div style="position:relative;width:${size}px;height:${size}px;flex-shrink:0">${body}${hatEl}</div>`;
}

/* ===== State ===== */
const KEY='pling_v1';
let state=normalize(load());
let ui={screen:'loading',shownPoints:0,overlay:null,tasksOpen:true,parentTab:'opgaver',editId:null,editRewardId:null,parentId:null,currentKidId:null,authMode:'login',authError:'',familyId:null,cloudMsg:'',invited:false};

try{if(/[?&]family=/.test(location.search)){ui.authMode='signup';ui.invited=true;}}catch(e){}
function normalize(s){
  s=s||{}; s.seq=s.seq||1; s.parents=s.parents||[]; s.kids=s.kids||[]; s.tasks=s.tasks||[]; s.rewards=s.rewards||[];
  s.notifications=s.notifications||[]; s.notifyCategories=s.notifyCategories||{Oplevelser:true,Privilegier:true,Avatar:true};
  if(!Array.isArray(s.allowedEmails))s.allowedEmails=[];
  if(s.currentKidId===undefined)s.currentKidId=null;
  s.tasks.forEach(t=>{if(t.assignMode==null){t.assignMode='age';t.minAge=2;t.maxAge=18;} if(t.kidIds==null)t.kidIds=[]; if(t.weekdays==null)t.weekdays=[];});
  s.rewards.forEach(r=>{if(r.reset==null)r.reset='daily';});
  s.parents.forEach(p=>{if(p.bodyColor==null)p.bodyColor='#B8C7F0'; if(p.hat==null)p.hat='👓'; if(p.pants==null)p.pants='';});
  s.kids.forEach(k=>{if(k.redeemed==null)k.redeemed={};});
  return s;
}
function load(){ try{const v=localStorage.getItem(KEY); return v?JSON.parse(v):null;}catch(e){return null;} }
function cloudData(s){return {seq:s.seq,parents:s.parents,kids:s.kids,tasks:s.tasks,rewards:s.rewards,notifications:s.notifications,notifyCategories:s.notifyCategories,allowedEmails:s.allowedEmails||[]};}
function save(){ const payload=cloudData(state); lastWritten=JSON.stringify(payload); if(window.cloud&&cloudUser)window.cloud.save(payload); try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){} }
function uid(p){ state.seq=(state.seq||1)+1; return p+state.seq; }

      {id:uid('t'),icon:'🛏️',title:'Red din seng',points:5,repeat:'daily',active:true,assignMode:'age',minAge:2,maxAge:18,kidIds:[],weekdays:[]},

/* ===== Dato ===== */
function pad(n){return n<10?'0'+n:''+n;}
function dstr(d){return ''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());}
function todayKey(){return 'd'+dstr(new Date());}
function weekIx(d){return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/(7*86400000));}
function periodKey(rep){
  const d=new Date();
  if(rep==='once')return 'once';
  if(rep==='daily'||rep==='weekdays')return 'd'+dstr(d);
  if(rep==='monthly')return 'm'+d.getFullYear()+pad(d.getMonth()+1);
  if(rep==='weekly')return 'w'+weekIx(d);
  if(rep==='biweekly')return 'b'+Math.floor(weekIx(d)/2);
  return 'd'+dstr(d);
}
function rewardPeriodKey(reset){const d=new Date();if(reset==='once')return 'once';if(reset==='weekly')return 'w'+weekIx(d);return 'd'+dstr(d);}
function relTime(ts){
  const s=Math.floor((Date.now()-ts)/1000);
  if(s<60)return 'lige nu'; if(s<3600)return Math.floor(s/60)+' min siden';
  if(s<86400)return Math.floor(s/3600)+' t. siden';
  const days=Math.floor(s/86400); if(days===1)return 'i går'; if(days<7)return days+' dage siden';
  return Math.floor(days/7)+' uger siden';
}

/* ===== Helpers ===== */
function currentKid(){return state.kids.find(k=>k.id===ui.currentKidId);}
function currentParent(){return state.parents.find(x=>x.id===ui.parentId)||state.parents[0];}
function activeTasks(){return state.tasks.filter(t=>t.active!==false);}
function taskAppliesTo(kid,t){
  const mode=t.assignMode||'age';
  if(mode==='kids')return (t.kidIds||[]).includes(kid.id);
  const mn=t.minAge==null?0:t.minAge, mx=t.maxAge==null?99:t.maxAge;
  return kid.age>=mn && kid.age<=mx;
}
function taskActiveToday(t){if(t.repeat==='weekdays'){return (t.weekdays||[]).includes(new Date().getDay());}return true;}
function tasksForKid(kid){return activeTasks().filter(t=>taskAppliesTo(kid,t));}
function tasksForKidToday(kid){return tasksForKid(kid).filter(taskActiveToday);}
function weekdayLabel(t){const w=t.weekdays||[];if(!w.length)return 'Vælg dage';return WEEKDAY_ORDER.filter(d=>w.includes(d)).map(d=>DAY_SHORT[d]).join(', ');}
function taskDone(kid,t){return kid.completed && kid.completed[t.id]===periodKey(t.repeat);}
function allDone(kid){const a=tasksForKidToday(kid);return a.length>0 && a.every(t=>taskDone(kid,t));}
function redeemedNow(k,r){return (k.redeemed||{})[r.id]===rewardPeriodKey(r.reset||'daily');}
function ownedList(k,kind){return kind==='color'?k.ownedColors:kind==='hat'?k.ownedHats:k.ownedPants;}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function emailName(e){var s=((e||'').split('@')[0]||'Forælder').replace(/[._-]+/g,' ').trim();return s?s.charAt(0).toUpperCase()+s.slice(1):'Forælder';}
function assignSummary(t){
  const mode=t.assignMode||'age';
  if(mode==='kids'){const n=(t.kidIds||[]).length;return n?` · ${n} valgte`:' · ingen valgt';}
  const mn=t.minAge==null?0:t.minAge, mx=t.maxAge==null?18:t.maxAge;
  if(mn<=2&&mx>=18)return ''; return ` · ${mn}–${mx} år`;
}

function setAuthBusy(t){const b=document.getElementById('authBtn');if(b){b.textContent=t;b.style.opacity='.7';}}
function friendlyAuthError(err){const c=(err&&(err.code||err.message))||'';if(c.indexOf('email-already-in-use')>=0)return 'E-mailen er allerede i brug — prøv at logge ind.';if(c.indexOf('invalid-email')>=0)return 'Ugyldig e-mail.';if(c.indexOf('weak-password')>=0)return 'Adgangskoden er for svag (min. 6 tegn).';if(c.indexOf('wrong-password')>=0||c.indexOf('invalid-credential')>=0)return 'Forkert e-mail eller adgangskode.';if(c.indexOf('user-not-found')>=0)return 'Ingen konto med den e-mail.';if(c.indexOf('network')>=0)return 'Netværksfejl — tjek din forbindelse.';return 'Noget gik galt. Prøv igen.';}
function authFail(err){ui.authError=friendlyAuthError(err);render();}
function doSignup(){const n=av('authName'),e=av('authEmail'),p=av('authPass');if(!n){ui.authError='Skriv dit navn';render();return;}if(!e||p.length<6){ui.authError='Tjek e-mail og adgangskode (min. 6 tegn)';render();return;}pendingSignupName=n;ui.authError='';setAuthBusy('Opretter…');if(window.cloud)window.cloud.signup(e,p).catch(authFail);else authFail({code:'network'});}
function doLogin(){const e=av('authEmail'),p=av('authPass');if(!e||!p){ui.authError='Skriv e-mail og adgangskode';render();return;}ui.authError='';setAuthBusy('Logger ind…');if(window.cloud)window.cloud.login(e,p).catch(authFail);else authFail({code:'network'});}
function logout(){ui.currentKidId=null;ui.parentId=null;ui.overlay=null;ui.familyId=null;ui.cloudMsg='';lastWritten=null;if(window.cloud)window.cloud.logout();}
window.onCloudError=function(e){
  var c=String((e&&(e.code||e.message))||'');
  try{console.warn('cloud',c);}catch(_){}
  if(c.indexOf('permission-denied')>=0){
    ui.cloudMsg='Du har ikke adgang til denne familie endnu. Fulgte du et invitationslink, så bed forælderen om at tilføje din e-mail, og prøv igen. Log evt. ud og ind igen.';
    ui.screen='cloudmsg'; render();
  }
};
window.onAuth=function(user){cloudUser=user||null;if(!user){ui.screen='auth';render();}};
window.onFamily=function(user,data,pending,fid){
  if(fid)ui.familyId=fid;
  if(pending)return; // vores egen lokale skrivning — lokal state er allerede opdateret
  var myEmail=((user&&user.email)||'').toLowerCase();
  var isFounder=!!(user&&fid&&fid===user.uid);
  if(data){
    const raw=JSON.stringify(data);
    if(raw===lastWritten){ if(ui.screen==='auth'||ui.screen==='loading'||ui.screen==='cloudmsg'){ui.screen='picker';render();} return; }
    lastWritten=raw; state=normalize(data);
    var changed=false;
    if(isFounder&&myEmail){
      if(state.allowedEmails.map(function(e){return (e||'').toLowerCase();}).indexOf(myEmail)<0){state.allowedEmails.push(myEmail);changed=true;}
      if(state.parents[0]&&!state.parents[0].email){state.parents[0].email=myEmail;changed=true;}
    }
    var mine=myEmail?state.parents.find(function(p){return (p.email||'').toLowerCase()===myEmail;}):null;
    if(!mine&&myEmail&&!isFounder){
      var np={id:uid('p'),name:pendingSignupName||emailName(myEmail),email:myEmail,pin:null,bodyColor:'#B8C7F0',hat:'👓',pants:''};
      state.parents.push(np); mine=np; changed=true;
    }
    if(mine)ui.parentId=mine.id;
    else if((!ui.parentId||!state.parents.find(function(x){return x.id===ui.parentId;}))&&state.parents[0])ui.parentId=state.parents[0].id;
    if(changed)save();
    if(ui.screen==='auth'||ui.screen==='loading'||ui.screen==='cloudmsg')ui.screen='picker';
    render();
  } else {
    if(!isFounder){
      ui.cloudMsg='Vi kunne ikke finde familien bag linket endnu. Bed forælderen om at sende invitationen igen, eller log ind med den konto der oprettede familien.';
      ui.screen='cloudmsg'; render(); return;
    }
    state=normalize({}); state.allowedEmails=myEmail?[myEmail]:[];
    const p={id:uid('p'),name:pendingSignupName||'Forælder',email:myEmail||null,pin:null,bodyColor:'#B8C7F0',hat:'👓',pants:''};
    state.parents=[p]; ui.parentId=p.id; seedDefaults(); ui.screen='picker'; save(); render();
  }
};

/* ===== Overlays ===== */
function renderOverlay(){
  const ov=document.getElementById('overlay'); const o=ui.overlay;
  if(!o){ov.className='';ov.innerHTML='';return;}
  ov.className='on';
  if(o.type==='setup')ov.innerHTML=setupOverlay(o);
  else if(o.type==='pin')ov.innerHTML=pinOverlay(o);
  else if(o.type==='addChild')ov.innerHTML=addChildOverlay(o);
  else if(o.type==='confirm')ov.innerHTML=confirmOverlay(o);
  else if(o.type==='emoji')ov.innerHTML=emojiOverlay(o);
  else if(o.type==='delkid')ov.innerHTML=delKidOverlay(o);
  else if(o.type==='invite')ov.innerHTML=inviteOverlay(o);
}
function dotsHTML(n){return [0,1,2,3].map(i=>`<i class="${i<n?'f':''}"></i>`).join('');}
function setDots(id,n){const el=document.getElementById(id);if(el)el.innerHTML=dotsHTML(n);}
function shakeBox(id){const el=document.getElementById(id);if(el){el.classList.remove('shakeit');void el.offsetWidth;el.classList.add('shakeit');}}
function keypad(fn){let b='';for(let i=1;i<=9;i++)b+=`<button onclick="${fn}('${i}')">${i}</button>`;b+=`<button class="blank"></button><button onclick="${fn}('0')">0</button><button onclick="${fn}('del')">⌫</button>`;return `<div class="keypad">${b}</div>`;}
function setupOverlay(o){
  if(o.step==='name'){
    return `<div class="setup"><h2>${o.addMode?'Tilføj forælder':'Opret forælderkonto'}</h2><div class="desc">Hvad hedder ${o.addMode?'den nye forælder':'du'}?</div>

/* ===== Actions ===== */
function go(screen){
  if((screen==='home'||screen==='shop'||screen==='editor'||screen==='history')&&currentKid())ui.shownPoints=currentKid().points;
  ui.screen=screen; render();
}
function openKid(id){ui.currentKidId=id;ui.shownPoints=(currentKid()||{}).points||0;ui.screen='home';render();}
function toggleTasks(){ui.tasksOpen=!ui.tasksOpen;render();}
function dismissMsg(){const k=currentKid();if(k){k.message=null;save();render();}}

function toggleTask(id,ev){
  const k=currentKid(); const t=state.tasks.find(x=>x.id===id); if(!k||!t)return;
  if(!k.completed)k.completed={};
  const pk=periodKey(t.repeat); const wasDone=k.completed[id]===pk;
  const x=ev?ev.clientX:0,y=ev?ev.clientY:0; const from=k.points;
  if(!wasDone){
    k.completed[id]=pk; k.points+=t.points; k.totalEarned=(k.totalEarned||0)+t.points;
    save(); render(); countTo(from,k.points); floatText(x,y,'+'+t.points,true); confettiAt(x,y);
    if(allDone(k)&&k.dailyBonusClaimed!==todayKey()){
      setTimeout(function(){var kk=currentKid();if(!kk||kk.dailyBonusClaimed===todayKey()||!allDone(kk))return;var f2=kk.points;kk.dailyBonusClaimed=todayKey();kk.points+=15;kk.totalEarned=(kk.totalEarned||0)+15;save();render();countTo(f2,kk.points);confettiBurstCenter();toast('🌟 Hele dagen klaret! +15 bonus');},650);
    }
  }else{
    delete k.completed[id]; k.points=Math.max(0,k.points-t.points); k.totalEarned=Math.max(0,(k.totalEarned||0)-t.points);
    let msg='Opgave fortrudt';
    if(k.dailyBonusClaimed===todayKey()&&!allDone(k)){k.dailyBonusClaimed=null;k.points=Math.max(0,k.points-15);k.totalEarned=Math.max(0,(k.totalEarned||0)-15);msg='Fortrudt — bonus rullet tilbage (−15)';}
    save(); render(); countTo(from,k.points); floatText(x,y,'−'+t.points,false); toast(msg);
  }
}

function startParentSetup(){ui.overlay={type:'setup',step:'name',name:'',pin1:'',pin2:'',error:''};renderOverlay();}
function startAddParent(){ui.overlay={type:'invite',email:'',error:'',link:''};renderOverlay();}
function confirmInvite(){
  const o=ui.overlay; const email=(o.email||'').trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){o.error='Skriv en gyldig e-mail';renderOverlay();return;}
  if(!Array.isArray(state.allowedEmails))state.allowedEmails=[];
  if(state.allowedEmails.map(function(e){return (e||'').toLowerCase();}).indexOf(email)<0)state.allowedEmails.push(email);
  save();
  const fid=ui.familyId||(cloudUser&&cloudUser.uid)||'';
  o.link=location.origin+location.pathname+'?family='+encodeURIComponent(fid);
  o.email=email; renderOverlay();
}
function copyInvite(){const o=ui.overlay;if(!o||!o.link)return;try{navigator.clipboard.writeText(o.link).then(function(){toast('Link kopieret 📋');},function(){toast('Markér og kopiér linket');});}catch(e){toast('Markér og kopiér linket');}}
function setSetupName(n){ui.overlay.name=n;const el=document.getElementById('pname');if(el)el.value=n;}
function setupNameNext(){if(!(ui.overlay.name||'').trim()){ui.overlay.error='Skriv et navn';renderOverlay();return;}ui.overlay.step='pin1';ui.overlay.error='';renderOverlay();}
function setupPin(d){
  const o=ui.overlay; const key=o.step==='pin1'?'pin1':'pin2';
  if(d==='del'){o[key]=o[key].slice(0,-1);setDots('setupDots',o[key].length);return;}
  if(o[key].length>=4)return;
  o[key]+=d; setDots('setupDots',o[key].length);
  if(o[key].length===4){
    if(o.step==='pin1'){setTimeout(()=>{o.step='pin2';o.error='';renderOverlay();},170);}
    else{ if(o.pin2===o.pin1){setTimeout(()=>finishParent(o.name,o.pin1,o.addMode),140);} else{o.error='PIN’erne matcher ikke';o.pin1='';o.pin2='';o.step='pin1';renderOverlay();shakeBox('setupBox');} }
  }
}
function finishParent(name,pin,addMode){
  const p={id:uid('p'),name:(name||'').trim(),pin:pin,bodyColor:'#B8C7F0',hat:'👓',pants:''};
  state.parents.push(p); seedDefaults(); ui.overlay=null; save();
  if(addMode){ui.screen='parent';ui.parentTab='indstil';render();toast('Forælder tilføjet 🎉');}
  else{ui.screen='picker';render();toast('Forælderkonto oprettet 🎉');setTimeout(()=>{if(state.kids.length===0)startAddChild();},500);}
}
function askParentPin(pid){const p=state.parents.find(x=>x.id===pid);if(p&&!p.pin){ui.parentId=pid;ui.parentTab='opgaver';ui.screen='parent';render();return;}ui.overlay={type:'pin',parentId:pid,entered:'',error:''};renderOverlay();}
function enterPin(d){
  const o=ui.overlay;
  if(d==='del'){o.entered=o.entered.slice(0,-1);setDots('pinDots',o.entered.length);return;}
  if(o.entered.length>=4)return; o.entered+=d; setDots('pinDots',o.entered.length);
  if(o.entered.length===4){
    const p=state.parents.find(x=>x.id===o.parentId);
    if(p&&p.pin===o.entered){ui.overlay=null;ui.parentId=p.id;ui.parentTab='opgaver';ui.screen='parent';render();}
    else{o.entered='';setDots('pinDots',0);const e=document.getElementById('pinErr');if(e)e.textContent='Forkert kode';shakeBox('pinBox');}
  }
}
function startAddChild(){ui.overlay={type:'addChild',name:'',age:6,error:''};renderOverlay();}
function chAge(d){ui.overlay.age=Math.max(2,Math.min(17,ui.overlay.age+d));const el=document.getElementById('addAge');if(el)el.textContent=ui.overlay.age+' år';}
function confirmAddChild(){
  const o=ui.overlay; const nm=(o.name||'').trim(); if(!nm){o.error='Skriv et navn';renderOverlay();return;}
  const idx=state.kids.length;
  const k={id:uid('k'),name:nm,age:o.age,color:KID_COLORS[idx%KID_COLORS.length],points:0,totalEarned:0,
    bodyColor:['#FFB6D9','#AEDFF7','#B8E8B0','#FFFFFF'][idx%4],hat:'',pants:'',
    ownedColors:['#FFFFFF','#FFB6D9','#B8E8B0','#AEDFF7'],ownedHats:[''],ownedPants:[''],
    completed:{},redeemed:{},redemptions:[],dailyBonusClaimed:null,message:null};
  state.kids.push(k); ui.overlay=null; save(); if(ui.screen==='welcome')ui.screen='picker'; render(); toast(nm+' er tilføjet 🎈');
}
function askDelKid(id){ui.overlay={type:'delkid',kidId:id};renderOverlay();}
function confirmDelKid(){const id=ui.overlay.kidId;state.kids=state.kids.filter(k=>k.id!==id);if(ui.currentKidId===id)ui.currentKidId=null;ui.overlay=null;save();render();}

function askRedeem(kind,idOrVal){
  const k=currentKid(); let item;
  if(kind==='reward')item=state.rewards.find(r=>r.id===idOrVal);
  else{const arr=kind==='color'?COLORS:kind==='hat'?HATS:PANTS;item=arr.find(i=>i.value===idOrVal);}
  if(!item||k.points<item.cost)return;
  ui.overlay={type:'confirm',kind:kind,item:item};renderOverlay();
}
function doRedeem(){
  const o=ui.overlay; const k=currentKid(); const from=k.points;
  if(k.points<o.item.cost){closeOverlay();return;}
  k.points-=o.item.cost; const cat=o.kind==='reward'?o.item.category:'Avatar';
  if(o.kind==='reward'){if(!k.redeemed)k.redeemed={};k.redeemed[o.item.id]=rewardPeriodKey(o.item.reset||'daily');}
  else{ownedList(k,o.kind).push(o.item.value);}
  k.redemptions=k.redemptions||[]; k.redemptions.push({icon:o.kind==='reward'?o.item.icon:'🎨',title:o.item.title,cost:o.item.cost,when:Date.now()});
  if(state.notifyCategories[cat]!==false)state.notifications.push({icon:o.kind==='reward'?o.item.icon:'🎨',kidName:k.name,title:o.item.title,cost:o.item.cost,when:Date.now(),category:cat});
  ui.overlay=null; save(); render(); countTo(from,k.points); confettiBurstCenter();
  toast(o.kind==='reward'?'Indløst! 🎉':'Købt! Skift den i Min profil 🎨');
}

function toggleEdit(id){ui.editId=ui.editId===id?null:id;render();}
function setTaskTitle(id,v){const t=state.tasks.find(x=>x.id===id);if(t){t.title=(v||'').trim();save();render();}}

function setTaskPointsVal(id,v){const t=state.tasks.find(x=>x.id===id);if(t){let n=parseInt(String(v).replace(/[^0-9]/g,''),10);if(isNaN(n))n=1;t.points=Math.max(1,Math.min(9999,n));save();render();}}

function toggleWeekday(id,d){const t=state.tasks.find(x=>x.id===id);if(t){t.weekdays=t.weekdays||[];const i=t.weekdays.indexOf(d);if(i>=0)t.weekdays.splice(i,1);else t.weekdays.push(d);save();render();}}
function setAssignMode(id,mode){const t=state.tasks.find(x=>x.id===id);if(t){t.assignMode=mode;if(mode==='age'){if(t.minAge==null)t.minAge=2;if(t.maxAge==null)t.maxAge=18;}if(mode==='kids'&&t.kidIds==null)t.kidIds=[];save();render();}}

function setMaxAge(id,d){const t=state.tasks.find(x=>x.id===id);if(t){const mn=t.minAge==null?0:t.minAge;t.maxAge=Math.min(18,Math.max(mn,(t.maxAge==null?18:t.maxAge)+d));save();render();}}
function toggleKidAssign(id,kidId){const t=state.tasks.find(x=>x.id===id);if(t){t.kidIds=t.kidIds||[];const i=t.kidIds.indexOf(kidId);if(i>=0)t.kidIds.splice(i,1);else t.kidIds.push(kidId);save();render();}}
function delTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);if(ui.editId===id)ui.editId=null;save();render();}
function addReward(){const r={id:uid('r'),icon:'🎁',title:'',cost:50,category:'Privilegier',reset:'daily',active:true};state.rewards.unshift(r);ui.editRewardId=r.id;save();render();}
function toggleEditR(id){ui.editRewardId=ui.editRewardId===id?null:id;render();}
function setRewardTitle(id,v){const r=state.rewards.find(x=>x.id===id);if(r){r.title=(v||'').trim();save();render();}}
function setRewardCost(id,d){const r=state.rewards.find(x=>x.id===id);if(r){r.cost=Math.max(5,r.cost+d);save();render();}}
function setRewardCostVal(id,v){const r=state.rewards.find(x=>x.id===id);if(r){let n=parseInt(String(v).replace(/[^0-9]/g,''),10);if(isNaN(n))n=5;r.cost=Math.max(0,Math.min(9999,n));save();render();}}
function setRewardCat(id,c){const r=state.rewards.find(x=>x.id===id);if(r){r.category=c;save();render();}}
function setRewardReset(id,rs){const r=state.rewards.find(x=>x.id===id);if(r){r.reset=rs;save();render();}}
function setRewardActive(id,ch){const r=state.rewards.find(x=>x.id===id);if(r){r.active=ch;save();render();}}
function delReward(id){state.rewards=state.rewards.filter(x=>x.id!==id);if(ui.editRewardId===id)ui.editRewardId=null;save();render();}
function pickEmoji(kind,id){ui.overlay={type:'emoji',kind:kind,id:id};renderOverlay();}
function setEmoji(e){const o=ui.overlay;if(o.kind==='task'){const t=state.tasks.find(x=>x.id===o.id);if(t)t.icon=e;}else{const r=state.rewards.find(x=>x.id===o.id);if(r)r.icon=e;}ui.overlay=null;save();render();}
function sendMsg(kidId){const el=document.getElementById('msg_'+kidId);if(!el)return;const txt=el.value.trim();const k=state.kids.find(x=>x.id===kidId);if(k){k.message=txt?{text:txt,from:currentParent().name,when:Date.now()}:null;save();render();toast(txt?('Besked sendt til '+k.name+' 💬'):'Besked fjernet');}}
function setNotify(cat,ch){state.notifyCategories[cat]=ch;save();render();}
function closeOverlay(){ui.overlay=null;renderOverlay();}

/* ===== Effects ===== */
function countTo(from,to){
  ui.shownPoints=to; const el=document.getElementById('pts'); if(!el)return;
  const steps=16; let i=0; el.textContent=from;
  const iv=setInterval(()=>{i++;el.textContent=Math.round(from+(to-from)*i/steps);if(i>=steps){clearInterval(iv);el.textContent=to;}},22);
  const p=document.getElementById('pill'); if(p){p.style.animation='none';void p.offsetWidth;p.style.animation='bouncePill .4s ease';}
}
function floatText(x,y,txt,pos){
  const f=document.getElementById('frame').getBoundingClientRect();
  const d=document.createElement('div'); d.className='float'; d.textContent=txt; d.style.color=pos?'#4C7A00':'#C7451B';
  d.style.left=((x||f.width/2)-f.left-8)+'px'; d.style.top=((y||120)-f.top-10)+'px';
  document.getElementById('frame').appendChild(d); setTimeout(()=>d.remove(),1000);
}
function confettiAt(x,y){
  const fr=document.getElementById('frame'); const f=fr.getBoundingClientRect();
  const cols=['#7C4DFF','#B4FF3C','#FF6B4A','#FFB6D9','#AEDFF7','#FFD700'];
  const cx=(x||f.width/2)-f.left, cy=(y||120)-f.top;
  for(let i=0;i<14;i++){const c=document.createElement('div');c.className='confetti';c.style.background=cols[i%cols.length];
    c.style.left=cx+'px';c.style.top=cy+'px';c.style.borderRadius=(i%2?'50%':'2px');
    const a=Math.random()*Math.PI*2,dist=40+Math.random()*70;
    c.style.setProperty('--dx',Math.cos(a)*dist+'px');c.style.setProperty('--dy',Math.sin(a)*dist+'px');
    c.style.setProperty('--rot',(Math.random()*540-270)+'deg');fr.appendChild(c);setTimeout(()=>c.remove(),820);}
}
function confettiBurstCenter(){const f=document.getElementById('frame').getBoundingClientRect();confettiAt(f.left+f.width/2,f.top+f.height*0.32);}
let toastT;
function toast(m){let t=document.querySelector('.toast');if(t)t.remove();t=document.createElement('div');t.className='toast';t.textContent=m;document.getElementById('frame').appendChild(t);clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2100);}

/* ===== Back-knap ===== */
function atRoot(){return ui.screen==='welcome'||ui.screen==='picker';}
function appBack(){
  if(ui.screen==='editor')go('home');
  else if(ui.screen==='history')go('shop');
  else if(ui.screen==='pavatar')go('parent');
  else if(ui.screen==='home'||ui.screen==='shop'||ui.screen==='parent')go('picker');
}
window.addEventListener('popstate',function(){
  if(ui.overlay){ui.overlay=null;renderOverlay();history.pushState(null,'');return;}
  if(!atRoot()){appBack();history.pushState(null,'');}
});

/* ===== Init ===== */
ui.screen='loading'; render();
try{history.pushState(null,'');}catch(e){}
setTimeout(function(){ if(ui.screen==='loading'){ ui.screen='auth'; render(); } },4000);
